<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔王快跑 · 适龄提示</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#222}h1{font-size:22px}h2{font-size:17px;margin-top:22px}</style></head><body><h1>《魔王快跑》适龄提示</h1><h2>适用年龄</h2><p>本游戏适合年满 8 周岁及以上的用户。</p><h2>游戏类型与内容</h2><p>本游戏是卡通风格的消除与策略战斗游戏：玩家通过消除矿石指挥魔物守住魔王。战斗为卡通表现，没有血腥画面。</p><h2>游戏功能</h2><p>本游戏含有扭蛋（抽取魔物）玩法，只使用游戏内获得的钻石，不能用现实货币购买；各稀有度的概率在扭蛋界面公示。本游戏没有聊天、好友等社交功能。游戏需要登录 TapTap 并完成实名认证，未成年人的游戏时间按国家防沉迷规定受到限制。</p><h2>健康游戏</h2><p>抵制不良游戏，拒绝盗版游戏。注意自我保护，谨防受骗上当。适度游戏益脑，沉迷游戏伤身。合理安排时间，享受健康生活。</p></body></html>
